name: VibeCards CI

on:
    push:
        branches:
            - main
            - staging
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    scan-for-secrets:
        name: Scan for secrets
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.13

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Scan for secrets using Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    format-lint-typecheck-build:
        name: Format, lint, typecheck, and build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.13

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Lint and Format
              run: bun run lint && bun run format:check

            - name: Type check
              run: bunx tsc --noEmit
            - name: Build
              run: bun run build

    test:
        name: Run Unit and E2E Tests
        needs: [scan-for-secrets, format-lint-typecheck-build]
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Copy .env.example to .env
              run: cp .env.example .env
            - name: Start test database
              run: docker compose up -d

            - name: Install bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.13

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run unit and integration tests
              run: bun run test:unit && bun run test:integration

    security-checks:
        name: Security Checks
        needs: [scan-for-secrets, format-lint-typecheck-build, test]
        runs-on: ubuntu-latest

        permissions:
            actions: read
            contents: read
            security-events: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.13

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Software Composition Analysis (SCA)
              run: bun audit --audit-level=high

            - name: Initialize CodeQL (SAST)
              uses: github/codeql-action/init@v3
              with:
                  languages: javascript, typescript

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v3
              with:
                  category: "/language:javascript,typescript"